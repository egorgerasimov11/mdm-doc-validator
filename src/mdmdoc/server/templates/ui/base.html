<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if token %}<meta name="mdmdoc-token" content="{{ token }}">{% endif %}
<title>{% block title %}mdmdoc{% endblock %}</title>
<link rel="stylesheet" href="/static/ui/app.css?v={{ asset_v }}">
</head>
<body>
<header>
  <div class="wrap header-row">
    <span class="wordmark">mdmdoc</span>
    <nav>
      <a href="/ui" class="{{ 'current' if page == 'dashboard' }}">Dashboard</a>
      <a href="/ui/training" class="{{ 'current' if page == 'training' }}">Training</a>
      <a href="/ui/rules" class="{{ 'current' if page == 'rules' }}">Rules</a>
      <a href="/ui/rules/approve">Approvals</a>
      <a href="/ui/debug" class="{{ 'current' if page == 'debug' }}">Debug</a>
    </nav>
    <span id="host-chip" class="meta host-chip">…</span>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<script src="/static/ui/app.js?v={{ asset_v }}"></script>
{% block script %}{% endblock %}
</body>
</html>
