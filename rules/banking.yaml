# Banking document rules — explicit and editable. The model never decides verdicts;
# these rules do. Sources: mdm-banking-doc-verdict + mdm-banking-checker skills.
#
# Governance metadata (per rule, hash-immune — never invalidates an approval):
#   tier:   corp | experimental | learned   (only tier:corp ships to SAP v1)
#   source: skill | policy | operator        (where the rule came from)
version: 1

doc_types: [bank_letter, bank_statement, supplier_letterhead, bank_screenshot,
            voided_check, ap_document, payment_instructions, invoice, email,
            editable_source, other]

tables:
  iban_length: {AD: 24, AE: 23, AT: 20, BE: 16, BG: 22, BH: 22, BR: 29, CH: 21,
                CY: 28, CZ: 24, DE: 22, DK: 18, EE: 20, EG: 29, ES: 24, FI: 18,
                FR: 27, GB: 22, GR: 27, HR: 21, HU: 28, IE: 22, IL: 23, IQ: 23,
                IS: 26, IT: 27, JO: 30, KW: 30, LB: 28, LI: 21, LT: 20, LU: 20,
                LV: 21, MC: 27, MT: 31, MX: 18, NL: 18, "NO": 15, PK: 24, PL: 28,
                PT: 25, QA: 29, RO: 24, SA: 24, SE: 24, SG: 19, SI: 19, SK: 24,
                TN: 24, TR: 26}

rules:
  - id: BNK-001
    name: invoice_never_bank_proof
    tier: corp
    source: policy
    applies_to: [invoice]
    when: {always: true}
    severity: CRITICAL
    verdict_effect: REJECT
    message: "Invoice used as banking support — an invoice (incl. pro forma) is never acceptable, even when it shows remittance/bank details. Request a bank letter, bank statement or supplier letterhead."
    message_ru: "Инвойс как банковское подтверждение не принимается (даже с реквизитами). Запросить bank letter / statement / supplier letterhead."

  - id: BNK-002
    name: email_as_proof
    tier: experimental
    source: policy
    applies_to: [email]
    when: {always: true}
    severity: CRITICAL
    verdict_effect: REJECT
    message: "Plain email is not normal bank support — exception-only with explicit Finance/Accounting approval evidence."
    message_ru: "Обычное письмо — не банковское подтверждение; только как исключение с явным одобрением Finance/Accounting."

  - id: BNK-003
    name: editable_source
    tier: corp
    source: policy
    applies_to: [editable_source]
    when: {always: true}
    severity: CRITICAL
    verdict_effect: REJECT
    message: "Editable file (.docx/.xlsx/.txt/.rtf) is not acceptable as bank proof. Request a PDF/scan on letterhead."
    message_ru: "Редактируемый файл (.docx/.xlsx/.txt/.rtf) не принимается как банковское подтверждение. Запросить PDF/скан."

  - id: BNK-005
    name: ap_form_self_certified
    tier: corp
    source: skill
    applies_to: [ap_document]
    when: {always: true}
    severity: NOTE
    verdict_effect: null
    message: "Self-certified AP/HCP bank-information form (not bank-issued). Acceptable per the HCP/AP policy for this request type; verify every detail against SAP and the request context."
    message_ru: "Самозаполненная AP/HCP форма банковских данных (не выпущена банком). Приемлемо по политике HCP/AP для этого типа запроса; каждую деталь сверить с SAP и контекстом запроса."

  - id: BNK-006
    name: statement_swift_not_shown
    tier: corp
    source: skill
    applies_to: [bank_statement]
    when: {check: field_empty, field: swift_bic}
    severity: NOTE
    verdict_effect: null
    message: "Bank statement shows no SWIFT/BIC — normal for statements; take SWIFT from the SAP/request-form comparison, not from this document."
    message_ru: "В выписке нет SWIFT/BIC — для выписок это норма; SWIFT берётся из сверки с SAP/формой запроса, не из этого документа."

  - id: BNK-004
    name: payment_instructions_context
    tier: corp
    source: skill
    applies_to: [payment_instructions]
    when: {always: true}
    severity: WARNING
    verdict_effect: WARNING
    message: "Supplier payment instructions — NOT an invoice. Acceptable only as an official, non-editable supplier document (letterhead) whose details match SAP; otherwise request a bank letter or bank statement. Mind payment-method limits printed on it (e.g. 'ACH only — not for wire transfers'). Any kickback reason is 'no official supplier support', never 'invoice'."
    message_ru: "Платёжные инструкции поставщика — это НЕ инвойс. Принимается только как официальный нередактируемый документ поставщика (letterhead) с реквизитами, совпадающими с SAP; иначе запросить bank letter / bank statement. Учитывай ограничения способа платежа (например, «ACH only — не для wire»). Причина kickback — «нет официального подтверждения поставщика», не «инвойс»."

  - id: BNK-010
    name: swift_shape
    tier: corp
    source: skill
    when: {check: swift_valid, field: swift_bic, args: {lengths: [8, 11]}}
    severity: CRITICAL
    verdict_effect: NEED_MANUAL_REVIEW
    message: "SWIFT/BIC {value} fails shape/country check: {detail}."

  - id: BNK-011
    name: iban_country_length
    tier: corp
    source: skill
    when: {check: iban_valid, field: iban, args: {table: iban_length}}
    severity: CRITICAL
    verdict_effect: NEED_MANUAL_REVIEW
    message: "IBAN {value_masked}: {detail}."

  - id: BNK-020
    name: doc_older_than_2y
    tier: corp
    source: skill
    when: {check: date_older_than, field: doc_date, args: {years: 2}}
    severity: NOTE
    verdict_effect: null
    message: "Document is older than 2 years ({detail}) — confirm the details are still current."

  - id: BNK-021
    name: missing_signature_bank_letter
    tier: corp
    source: skill
    applies_to: [bank_letter]
    when: {check: unsigned_no_evidence, field: signed}
    severity: WARNING
    verdict_effect: WARNING
    message: "Bank letter appears unsigned/unstamped (no officer block either)."
    message_ru: "Банковское письмо без подписи/печати (и без блока офицера)."

  - id: BNK-026
    name: typed_officer_block_instead_of_signature
    tier: corp
    source: skill
    applies_to: [bank_letter]
    when: {check: unsigned_typed_block, field: signed}
    severity: NOTE
    verdict_effect: null
    message: "No wet signature/stamp; compensating evidence present ({detail}) — normal for system-issued bank letters; note for the Data Owner."
    message_ru: "Живой подписи/печати нет; есть компенсирующее свидетельство ({detail}) — норма для системно выпускаемых банковских писем; заметка для Data Owner."

  - id: BNK-022
    name: partial_screenshot
    tier: corp
    source: skill
    applies_to: [bank_screenshot]
    when: {flag_true: partial_capture}
    severity: WARNING
    verdict_effect: NEED_MANUAL_REVIEW
    message: "Screenshot appears cropped/partial — key fields may be cut off."

  - id: BNK-023
    name: missing_account_holder
    tier: corp
    source: skill
    # bank_statement/payment_instructions included since the 2026-07 audit:
    # a holder-less statement could ACCEPT in the degraded (no-LLM) mode
    applies_to: [bank_letter, bank_statement, supplier_letterhead, bank_screenshot, voided_check, ap_document, payment_instructions, other]
    when: {field_missing: account_holder}
    severity: WARNING
    verdict_effect: NEED_MANUAL_REVIEW
    message: "No account holder / beneficiary name readable on the document."

  - id: BNK-024
    name: no_banking_identity
    tier: corp
    source: skill
    applies_to: [bank_letter, bank_statement, supplier_letterhead, bank_screenshot, voided_check, ap_document, payment_instructions, other]
    when: {check: no_bank_ids}
    severity: WARNING
    verdict_effect: NEED_MANUAL_REVIEW
    message: "Document shows no bank account identifiers (no IBAN, account number or routing) — cannot serve as banking evidence as-is."

  - id: BNK-025
    name: missing_bank_name
    tier: corp
    source: skill
    # statements are bank-issued — a real one always prints the bank name
    # (supplier-issued types stay excluded, as before)
    applies_to: [bank_letter, bank_statement, bank_screenshot, voided_check]
    when: {field_missing: bank_name}
    severity: WARNING
    verdict_effect: WARNING
    message: "Bank name not readable on the document."

  - id: BNK-030
    name: unrecognized_document_type
    tier: experimental
    source: policy
    # An UNRECOGNIZED document (doc_type could not be established) must never
    # auto-accept, however complete its fields look — "understand what the
    # document IS" is the first check. Live case: a Chinese conference
    # exhibition notice carrying the organiser's remittance details.
    # NMR-only: cannot produce a false REJECT. Left PENDING on purpose —
    # while pending, the approvals gate already holds doc_type=other at
    # NEED_MANUAL_REVIEW; the rule owner decides its fate in the panel.
    applies_to: [other]
    when: {always: true}
    severity: WARNING
    verdict_effect: NEED_MANUAL_REVIEW
    message: "Document type could not be established — an unrecognized document is never auto-accepted; review manually."
    message_ru: "Тип документа не установлен — неопознанный документ не принимается автоматически; проверьте вручную."
