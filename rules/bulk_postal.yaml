# Bulk postal/region validation data (V-wave). Logic in bulk/region.py.
#
# postal_formats: per-ISO2 regex for the POSTAL CODE shape (format only —
# existence needs a reference dataset and is out of scope here).
# region_required: countries where SAP address maintenance expects a REGION
# whenever the country has a region table (empty region -> INVALID there;
# elsewhere an empty region with T005S entries present is SUSPICIOUS).
version: 1

postal_formats:
  US: '^\d{5}(-\d{4})?$'
  CA: '^[A-Za-z]\d[A-Za-z] ?\d[A-Za-z]\d$'
  GB: '^[A-Za-z]{1,2}\d[A-Za-z\d]? ?\d[A-Za-z]{2}$'
  DE: '^\d{5}$'
  FR: '^\d{5}$'
  IT: '^\d{5}$'
  ES: '^\d{5}$'
  PT: '^\d{4}(-\d{3})?$'
  NL: '^\d{4} ?[A-Za-z]{2}$'
  BE: '^\d{4}$'
  LU: '^(L-)?\d{4}$'
  AT: '^\d{4}$'
  CH: '^\d{4}$'
  LI: '^\d{4}$'
  DK: '^\d{4}$'
  "NO": '^\d{4}$'
  SE: '^\d{3} ?\d{2}$'
  FI: '^\d{5}$'
  IS: '^\d{3}$'
  IE: '^[A-Za-z]\d{2} ?[A-Za-z\d]{4}$'
  PL: '^\d{2}-\d{3}$'
  CZ: '^\d{3} ?\d{2}$'
  SK: '^\d{3} ?\d{2}$'
  HU: '^\d{4}$'
  RO: '^\d{6}$'
  BG: '^\d{4}$'
  GR: '^\d{3} ?\d{2}$'
  HR: '^\d{5}$'
  SI: '^\d{4}$'
  RS: '^\d{5}$'
  BA: '^\d{5}$'
  MK: '^\d{4}$'
  AL: '^\d{4}$'
  EE: '^\d{5}$'
  LV: '^(LV-)?\d{4}$'
  LT: '^(LT-)?\d{5}$'
  UA: '^\d{5}$'
  RU: '^\d{6}$'
  BY: '^\d{6}$'
  KZ: '^\d{6}$'
  TR: '^\d{5}$'
  IL: '^\d{5}(\d{2})?$'
  AE: ''            # no postal codes — any value is SUSPICIOUS, empty is fine
  SA: '^\d{5}(-\d{4})?$'
  QA: ''
  KW: ''
  BH: '^\d{3,4}$'
  OM: '^\d{3}$'
  JO: '^\d{5}$'
  EG: '^\d{5}$'
  ZA: '^\d{4}$'
  NG: '^\d{6}$'
  KE: '^\d{5}$'
  MA: '^\d{5}$'
  TN: '^\d{4}$'
  CN: '^\d{6}$'
  JP: '^\d{3}-?\d{4}$'
  KR: '^\d{5}$'
  TW: '^\d{3}(\d{2,3})?$'
  HK: ''
  SG: '^\d{6}$'
  MY: '^\d{5}$'
  TH: '^\d{5}$'
  VN: '^\d{5,6}$'
  PH: '^\d{4}$'
  ID: '^\d{5}$'
  IN: '^\d{6}$'
  PK: '^\d{5}$'
  BD: '^\d{4}$'
  LK: '^\d{5}$'
  AU: '^\d{4}$'
  NZ: '^\d{4}$'
  BR: '^\d{5}-?\d{3}$'
  AR: '^([A-Za-z]\d{4}[A-Za-z]{3}|\d{4})$'
  CL: '^\d{7}$'
  CO: '^\d{6}$'
  PE: '^\d{5}$'
  UY: '^\d{5}$'
  PY: '^\d{4}$'
  BO: ''
  EC: '^\d{6}$'
  VE: '^\d{4}(-[A-Za-z])?$'
  MX: '^\d{5}$'
  CR: '^\d{5}$'
  PA: '^\d{4}$'
  GT: '^\d{5}$'
  DO: '^\d{5}$'

region_required: [US, CA, AU, BR, MX, IN, CN, JP, IT, ES]
